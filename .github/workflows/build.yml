name: Build Geode Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 https://github.com/geode-sdk/sdk.git sdk
          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install 7-Zip
        run: |
          winget install --id 7zip.7zip --accept-source-agreements --accept-package-agreements
          $7zPath = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7zPath)) {
            $7zPath = "C:\Program Files (x86)\7-Zip\7z.exe"
          }
          if (-not (Test-Path $7zPath)) {
            Write-Error "7z not found"
            exit 1
          }
          echo "SEVENZIP=$7zPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download and extract Geode binaries
        run: |
          $url = "https://github.com/geode-sdk/geode/releases/download/v5.10.1/geode-installer-v5.10.1-win.exe"
          Invoke-WebRequest -Uri $url -OutFile geode-installer.exe
          & $env:SEVENZIP x geode-installer.exe -ogeode-bin -y
          # Создаём папки bin и lib в SDK
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\bin"
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\lib"
          # Копируем все файлы из распакованного установщика
          Copy-Item -Path "geode-bin\*" -Destination "$env:GEODE_SDK\bin\" -Recurse -Force
          Copy-Item -Path "geode-bin\*" -Destination "$env:GEODE_SDK\lib\" -Recurse -Force

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
