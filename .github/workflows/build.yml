name: Build Geode Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 https://github.com/geode-sdk/sdk.git sdk
          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download Geode binaries
        run: |
          $url = "https://github.com/geode-sdk/geode/releases/download/v5.10.1/geode-v5.10.1-win.zip"
          Invoke-WebRequest -Uri $url -OutFile geode-bin.zip
          Expand-Archive -Path geode-bin.zip -DestinationPath geode-bin

      - name: Prepare SDK folders and copy binaries
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\lib", "$env:GEODE_SDK\bin"
          Get-ChildItem -Path geode-bin -Recurse -Include *.lib,*.dll | ForEach-Object {
            Copy-Item $_.FullName -Destination "$env:GEODE_SDK\lib\" -Force
            Copy-Item $_.FullName -Destination "$env:GEODE_SDK\bin\" -Force
          }
          Get-ChildItem "$env:GEODE_SDK\lib" -Filter "Geode.lib" | Rename-Item -NewName "geode.lib" -Force
          Get-ChildItem "$env:GEODE_SDK\lib" -Filter "Geode.dll" | Rename-Item -NewName "geode.dll" -Force
          Get-ChildItem "$env:GEODE_SDK\bin" -Filter "Geode.lib" | Rename-Item -NewName "geode.lib" -Force
          Get-ChildItem "$env:GEODE_SDK\bin" -Filter "Geode.dll" | Rename-Item -NewName "geode.dll" -Force

      - name: Patch SDK CMakeLists to disable Codegen
        run: |
          $cmakeFile = "$env:GEODE_SDK\CMakeLists.txt"
          # Заменяем Win64 на Win32
          (Get-Content $cmakeFile) -replace "'Win64'", "'Win32'" | Set-Content $cmakeFile
          # Заменяем вызов Codegen на заглушку
          (Get-Content $cmakeFile) -replace 'execute_process\([^)]*Codegen\.exe[^)]*\)', 'message(STATUS "Codegen disabled")' | Set-Content $cmakeFile

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A Win32 -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILDING_CODEGEN=ON -DGEODE_DISABLE_CODEGEN=ON

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
