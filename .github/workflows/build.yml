name: Build Geode Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          winget install --id GeodeSDK.GeodeCLI --accept-source-agreements --accept-package-agreements
          refreshenv
          $env:PATH = "$env:PATH;C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\Links"

      - name: Install Geode SDK
        run: |
          geode sdk install

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
