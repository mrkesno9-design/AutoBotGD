name: Build Geode Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Клонируем SDK
      - name: Clone Geode SDK
        run: |
          git clone --depth 1 https://github.com/geode-sdk/sdk.git sdk
          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 2. Скачиваем бинарники Geode
      - name: Download Geode binaries
        run: |
          $url = "https://github.com/geode-sdk/geode/releases/download/v5.10.1/geode-v5.10.1-win.zip"
          Invoke-WebRequest -Uri $url -OutFile geode-bin.zip
          Expand-Archive -Path geode-bin.zip -DestinationPath geode-bin

      # 3. Копируем бинарники в SDK и подгоняем имена
      - name: Install binaries into SDK
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\lib"
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\bin"

          # Копируем все .lib и .dll в обе папки
          Get-ChildItem -Path geode-bin -Recurse -Include *.lib,*.dll | ForEach-Object {
            Copy-Item $_.FullName -Destination "$env:GEODE_SDK\lib\" -Force
            Copy-Item $_.FullName -Destination "$env:GEODE_SDK\bin\" -Force
          }

          # Если в lib один .lib, переименуем в geode.lib
          $libFiles = Get-ChildItem "$env:GEODE_SDK\lib" -Filter *.lib
          if ($libFiles.Count -eq 1) {
            Rename-Item $libFiles[0].FullName -NewName "geode.lib"
          }

          # Если в bin один .dll, переименуем в geode.dll
          $dllFiles = Get-ChildItem "$env:GEODE_SDK\bin" -Filter *.dll
          if ($dllFiles.Count -eq 1) {
            Rename-Item $dllFiles[0].FullName -NewName "geode.dll"
          }

          # Выведем содержимое папок для отладки
          Write-Host "=== lib ==="
          Get-ChildItem "$env:GEODE_SDK\lib" | Select-Object Name
          Write-Host "=== bin ==="
          Get-ChildItem "$env:GEODE_SDK\bin" | Select-Object Name

      # 4. Настраиваем 32-битный MSVC
      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # 5. Конфигурируем CMake
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # 6. Собираем
      - name: Build
        run: |
          cmake --build build --config Release

      # 7. Загружаем артефакт
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
