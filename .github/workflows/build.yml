name: Build Geode Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 https://github.com/geode-sdk/sdk.git sdk
          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Geode CLI via winget
        run: |
          winget install --id GeodeSDK.GeodeCLI --accept-source-agreements --accept-package-agreements
          # Добавляем возможные пути в PATH
          $env:PATH += ";$env:USERPROFILE\AppData\Local\Microsoft\WinGet\Links"
          $env:PATH += ";$env:USERPROFILE\AppData\Local\Programs\GeodeCLI"
          $env:PATH += ";$env:USERPROFILE\AppData\Local\Programs\Geode"
          # Ищем geode.exe
          $geode = Get-Command geode -ErrorAction SilentlyContinue
          if (-not $geode) {
            $geodePath = Get-ChildItem -Path C:\Users\runneradmin\AppData\Local -Filter geode.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
            if ($geodePath) { $env:PATH += ";$geodePath" }
          }
          # Проверяем
          geode --version
          if ($LASTEXITCODE -ne 0) { Write-Error "geode not found"; exit 1 }

      - name: Install Geode SDK binaries
        run: |
          geode sdk install-binaries

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
