name: Build Geode Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 https://github.com/geode-sdk/sdk.git sdk
          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download Geode binaries
        run: |
          $url = "https://github.com/geode-sdk/geode/releases/download/v5.10.1/geode-v5.10.1-win.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile geode-bin.zip
          } catch {
            Write-Host "Trying alternative URL..."
            $url = "https://github.com/geode-sdk/geode/releases/latest/download/geode-v5.10.1-win.zip"
            Invoke-WebRequest -Uri $url -OutFile geode-bin.zip
          }
          Expand-Archive -Path geode-bin.zip -DestinationPath geode-bin
          # Создаём папку bin внутри SDK и копируем туда все файлы
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\bin"
          Copy-Item -Path "geode-bin\*" -Destination "$env:GEODE_SDK\bin\" -Recurse -Force
          # Также копируем в lib на всякий случай
          New-Item -ItemType Directory -Force -Path "$env:GEODE_SDK\lib"
          Copy-Item -Path "geode-bin\*" -Destination "$env:GEODE_SDK\lib\" -Recurse -Force

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
