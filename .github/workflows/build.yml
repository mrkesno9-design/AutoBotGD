name: Build Geode Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 https://github.com/geode-sdk/sdk.git sdk
          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Geode CLI
        run: |
          # Устанавливаем CLI через winget
          winget install --id GeodeSDK.GeodeCLI --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) {
            Write-Host "winget install failed with code $LASTEXITCODE"
            exit 1
          }
          # Ищем geode.exe в разных местах
          $geodeCandidates = @(
            "$env:USERPROFILE\AppData\Local\Microsoft\WinGet\Links\geode.exe",
            "$env:USERPROFILE\AppData\Local\Programs\GeodeCLI\geode.exe",
            "$env:USERPROFILE\AppData\Local\Programs\Geode\geode.exe"
          )
          $geodePath = $null
          foreach ($cand in $geodeCandidates) {
            if (Test-Path $cand) {
              $geodePath = $cand
              break
            }
          }
          if (-not $geodePath) {
            # Ищем рекурсивно в LocalAppData
            $geodePath = Get-ChildItem -Path "$env:USERPROFILE\AppData\Local" -Filter geode.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $geodePath) {
            # Ищем по всему диску C (может быть долго, но надёжно)
            $geodePath = Get-ChildItem -Path C:\ -Filter geode.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $geodePath) {
            Write-Error "geode.exe not found anywhere"
            exit 1
          }
          Write-Host "geode found at: $geodePath"
          $geodeDir = Split-Path $geodePath
          echo "GEODE_CLI_DIR=$geodeDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PATH += ";$geodeDir"

      - name: Install Geode SDK binaries
        run: |
          $geodeExe = Join-Path $env:GEODE_CLI_DIR "geode.exe"
          & $geodeExe sdk install-binaries

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/**/*.geode
